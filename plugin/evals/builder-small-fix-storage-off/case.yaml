# Live run 2 as an eval case: the small fix of live run 1 with storage off; needs T6, because stage 1 of the builder records its skills with rex_assign.
# Run with the job binary first on PATH: claude plugin eval plugin --case builder-small-fix-storage-off --ablation none --runs 1 --model sonnet --judge-model sonnet --scaffold --allow-tools Bash Edit Write ToolSearch 'mcp__super-rex__*' --no-publish
schema_version: "1.0"
name: builder-small-fix-storage-off
description: needs T6. A person's small fix opens a job, plans it, delivers one squash commit through rex_merge, and closes delivered, with storage off, so no store is written.
tags: [needs-t6, live-run-2, builder]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /super-rex:orchestration-builder Fix the spelling of "recieve" in NOTES.md.
    Merge to main: yes.
  model: sonnet
  max_turns: 200
  timeout_seconds: 3600
  # dontAsk refuses any agent type not listed: only the grid agents of tiers medium (Sonnet) and high (Opus) can start,
  # so no Haiku or Fable agent runs. disallowed_tools takes bare tool names only, so it cannot name an agent type.
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - Bash
    - ToolSearch
    - TodoWrite
    - 'mcp__super-rex__*'
    - Agent(super-rex:model-medium-effort-low)
    - Agent(super-rex:model-medium-effort-medium)
    - Agent(super-rex:model-medium-effort-high)
    - Agent(super-rex:model-medium-effort-xhigh)
    - Agent(super-rex:model-medium-effort-max)
    - Agent(super-rex:model-high-effort-low)
    - Agent(super-rex:model-high-effort-medium)
    - Agent(super-rex:model-high-effort-high)
    - Agent(super-rex:model-high-effort-xhigh)
    - Agent(super-rex:model-high-effort-max)
runs: 1
graders:
  - type: tool_order
    name: the job opens before it is planned
    before: mcp__super-rex__rex_job_open
    after: mcp__super-rex__rex_job_plan
  - type: tool_order
    name: the plan comes before the merge
    before: mcp__super-rex__rex_job_plan
    after: mcp__super-rex__rex_merge
  - type: tool_order
    name: the merge comes before the close
    before: mcp__super-rex__rex_merge
    after: mcp__super-rex__rex_job_close
  - type: regex
    name: the job's merge answer came from the prompt
    target: trace
    pattern: "merge=yes"
  - type: regex
    name: rex_merge pushed the squash commit
    target: trace
    pattern: "merged=yes"
  - type: regex
    name: the job opened with storage off
    target: trace
    pattern: "storage=off"
  - type: regex
    name: the job closed delivered
    target: trace
    pattern: "status=delivered"
  - type: file_exists
    name: no store was written
    path: .rex/rex.db
    exists: false
  - type: regex
    name: no gate refused anything
    target: trace
    pattern: "rex gate:"
    match: not_contains
