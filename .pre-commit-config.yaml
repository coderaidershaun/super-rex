# This repo has no CI service: these hooks are its checks. `pre-commit install`
# sets up both git hooks. The Rust checks run at push, so a commit stays fast.
# They run on every push, because a push that only deletes files has no files
# to check, and a deleted file can still break the build.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: trivy
        name: trivy secrets, vulnerabilities and misconfigurations
        entry: trivy fs --timeout 15m --quiet --skip-version-check --scanners secret,vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs target,node_modules --skip-files .env .
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked --workspace
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-msrv
        name: cargo check on the oldest Rust that Cargo.toml claims
        entry: bash scripts/check-msrv.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-package
        name: cargo package, then the tests from inside the package
        entry: bash scripts/check-package.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The mod's checks. A plugin test cannot read fixtures/shared, so the mod reads a generated copy, and a copy that
      # differs from its source would let the mod and the binary pass against different fixtures.
      - id: shared-fixture-copy
        name: plugin/hooks/book/shared.ts equals fixtures/shared
        entry: python3 -I scripts/gen-shared-fixtures.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: tsc-plugin
        name: tsc of the mod and its evals
        entry: bash -c 'tsc -p plugin && tsc -p plugin/evals'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: plugin-test
        name: claude plugin test plugin
        entry: claude plugin test plugin
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
